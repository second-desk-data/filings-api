openapi: 3.0.3
info:
  title: New Business Filings API
  version: 0.4.0
  description: |
    Every new business filed with the state, as a clean JSON API —
    searchable by state, region (parish/county), city, name, entity
    type, industry category, likely-need segment, and filing age.

    Secretaries of State publish new business filings as raw,
    unstructured bulk files and weekly text dumps. This API ingests
    each covered state's published filings, cleans them, and tags
    every record with its region (Louisiana parish, county elsewhere),
    an industry category inferred from the business name, likely-need
    segments (needs a website, needs bookkeeping, likely hiring CDL
    drivers, and more), and `agent_is_commercial` — a flag for filings
    whose registered agent is a commercial formation mill.
    Connecticut records additionally carry the filer's own published
    business email (`email_as_filed`) and the NAICS code the filer
    reported (`naics_code` / `naics_title`).

    Coverage: 5,724,302 filings across 8 states — Pennsylvania
    2,386,129 · Connecticut 1,310,099 · New York 750,671 · Colorado
    536,338 · Iowa 351,617 · Oregon 203,815 · Louisiana 126,710 ·
    Florida 58,923.

    Auth: API key in the `X-API-Key` header, with per-tier daily
    quotas and per-key scope (all data / one state / one city). Scope
    is enforced on every endpoint: out-of-scope records are excluded
    from results and counts, and single-record lookups outside the
    scope answer 404.

    Data honesty: industry is inferred from the business name (state
    filings carry no industry code) and need segments are likely-need
    marketing segments inferred from business type — both documented
    as such, never presented as verified needs.
  contact:
    name: Second Desk
    url: https://deskside.gumroad.com
    email: seconddesks@proton.me
servers:
  - url: https://filings-api.onrender.com
    description: Production
tags:
  - name: filings
    description: Search and look up business filings
  - name: coverage
    description: Coverage and classification counts
  - name: system
    description: Health and service metadata
  - name: webhooks
    description: Marketplace delivery callbacks (signature-authenticated)
  - name: catalog
    description: The sellable catalog — every data family and pack, with counts and prices
  - name: board
    description: Work board — roles posted by employers, resumes listed by the candidates themselves
  - name: keys
    description: Self-serve API key issuance
  - name: discovery
    description: Agent discovery and release history
security:
  - ApiKeyAuth: []
paths:
  /:
    get:
      tags: [system]
      summary: Service index
      description: Public. Lists the API's endpoints and version.
      security: []
      operationId: getIndex
      responses:
        '200':
          description: Service name, version, description, and the endpoint map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  description:
                    type: string
                  docs:
                    type: string
                  openapi:
                    type: string
                  endpoints:
                    type: object
                    additionalProperties:
                      type: string
  /health:
    get:
      tags: [system]
      summary: Health + dataset stats
      description: Public. Dataset status, totals, per-state counts, and freshness.
      security: []
      operationId: getHealth
      responses:
        '200':
          description: Dataset health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      tags: [system]
      summary: This OpenAPI spec
      description: Public. The OpenAPI 3 description of this API, served by the API itself.
      security: []
      operationId: getOpenApiSpec
      responses:
        '200':
          description: The OpenAPI document (YAML).
          content:
            application/yaml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/Error'
  /v1/businesses:
    get:
      tags: [filings]
      summary: Search filings
      description: |
        Search business filings. All parameters are optional and all
        filters compose. Results are ordered by filing date, newest
        first. The response carries a `scope` object describing the
        key's bound scope, and a `scope_note` when the request
        explicitly asked outside that scope.
      operationId: searchBusinesses
      parameters:
        - name: q
          in: query
          description: Substring match on business name (case-insensitive).
          schema:
            type: string
          example: transport
        - name: state
          in: query
          description: Filing state (the state whose filings these are — the record's `filing_state`).
          schema:
            type: string
            enum: [CO, CT, FL, IA, LA, NY, OR, PA]
          example: LA
        - name: parish
          in: query
          description: Louisiana parish (exact, case-insensitive).
          schema:
            type: string
          example: Evangeline
        - name: county
          in: query
          description: County for non-LA states (exact, case-insensitive).
          schema:
            type: string
          example: Travis
        - name: region
          in: query
          description: Parish or county, whichever the record's state uses.
          schema:
            type: string
          example: Evangeline
        - name: city
          in: query
          description: Mailing city (exact, case-insensitive).
          schema:
            type: string
          example: Ville Platte
        - name: type
          in: query
          description: Entity type.
          schema:
            type: string
            enum: [LLC, Corporation, Nonprofit Corporation, Foreign Entity, Other]
          example: LLC
        - name: origin
          in: query
          description: Domestic (new in-state entity) or foreign (out-of-state entity qualifying in-state).
          schema:
            type: string
            enum: [domestic, foreign]
          example: domestic
        - name: category
          in: query
          description: Industry slug from /v1/categories (inferred from the business name).
          schema:
            type: string
            enum:
              - trucking-and-transport
              - food-and-restaurants
              - construction-and-trades
              - auto-services
              - beauty-and-personal-care
              - pet-services
              - childcare-and-education
              - health-wellness-and-fitness
              - cleaning-services
              - lawn-and-landscaping
              - real-estate-and-property
              - retail-and-shopping
              - professional-services
              - technology-and-it
              - events-and-entertainment
              - agriculture-and-outdoors
              - other-unclassified
          example: trucking-and-transport
        - name: need
          in: query
          description: Likely-need segment slug from /v1/categories.
          schema:
            type: string
            enum:
              - needs-website
              - needs-phone-internet
              - needs-bookkeeping
              - needs-commercial-insurance
              - needs-signage
              - needs-pos-system
              - needs-hiring-help
              - likely-hiring-cdl-drivers
          example: likely-hiring-cdl-drivers
        - name: age_days
          in: query
          description: Filed within the last N days of the dataset's newest filing (age < N; the anchor is per-state when one state is in play).
          schema:
            type: integer
            minimum: 1
          example: 90
        - name: year
          in: query
          description: Calendar year of filing (YYYY).
          schema:
            type: string
            pattern: '^\d{4}$'
          example: '2025'
        - name: from
          in: query
          description: Filing-date range start (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: '2026-11-20'
        - name: to
          in: query
          description: Filing-date range end (YYYY-MM-DD).
          schema:
            type: string
            format: date
          example: '2026-11-21'
        - name: limit
          in: query
          description: Page size, 1–100.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          description: Pagination offset.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Matching filings (one page) plus the total count.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Plan-Tier:
              $ref: '#/components/headers/XPlanTier'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/businesses/{charter_number}:
    get:
      tags: [filings]
      summary: Look up one filing by charter number
      description: |
        Returns the single record for a state charter/entity number,
        or 404. Pass `state` when a charter number exists in more than
        one state (otherwise 400 `ambiguous_charter`). Records outside
        the key's scope answer 404, exactly like nonexistent ones.
      operationId: getBusiness
      parameters:
        - name: charter_number
          in: path
          required: true
          description: The state's charter/entity number — the record's stable ID.
          schema:
            type: string
          example: 47303845K
        - name: state
          in: query
          description: Filing state, to disambiguate a charter number that exists in several states.
          schema:
            type: string
            enum: [CO, CT, FL, IA, LA, NY, OR, PA]
      responses:
        '200':
          description: The filing record.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Plan-Tier:
              $ref: '#/components/headers/XPlanTier'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilingRecord'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/regions:
    get:
      tags: [coverage]
      summary: Coverage by region
      description: |
        Filing counts by region — parishes for Louisiana, counties for
        other states. Optional `state` narrows to one state. Counts
        always respect the key's scope.
      operationId: listRegions
      parameters:
        - name: state
          in: query
          description: Narrow to one filing state.
          schema:
            type: string
            enum: [CO, CT, FL, IA, LA, NY, OR, PA]
      responses:
        '200':
          description: Per-state region coverage.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Plan-Tier:
              $ref: '#/components/headers/XPlanTier'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/parishes:
    get:
      tags: [coverage]
      summary: Louisiana parishes (alias view of /v1/regions)
      description: Backward-compatible Louisiana coverage view — the same numbers as /v1/regions for LA.
      operationId: listParishes
      responses:
        '200':
          description: Louisiana parish coverage.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Plan-Tier:
              $ref: '#/components/headers/XPlanTier'
          content:
            application/json:
              schema:
                type: object
                properties:
                  parishes_covered:
                    type: integer
                  parishes_total_in_louisiana:
                    type: integer
                  records_with_parish:
                    type: integer
                  records_total:
                    type: integer
                  parishes:
                    type: array
                    items:
                      type: object
                      properties:
                        parish:
                          type: string
                        filings:
                          type: integer
                  scope:
                    $ref: '#/components/schemas/Scope'
                  scope_note:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/categories:
    get:
      tags: [coverage]
      summary: Industries + need segments with live counts
      description: |
        Every industry category and likely-need segment with live
        record counts. Optional `state` narrows to one state; counts
        always respect the key's scope.
      operationId: listCategories
      parameters:
        - name: state
          in: query
          description: Narrow counts to one filing state.
          schema:
            type: string
            enum: [CO, CT, FL, IA, LA, NY, OR, PA]
      responses:
        '200':
          description: Category and segment counts.
          headers:
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Plan-Tier:
              $ref: '#/components/headers/XPlanTier'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /webhooks/vermarco:
    get:
      tags: [webhooks]
      summary: Vermarco delivery endpoint liveness
      description: |
        Public liveness view of the Vermarco (sellmydata.ai /
        Vertical Marketplace) delivery callback. The delivery protocol
        itself is the POST below, authenticated by the platform's
        Ed25519 signature — not by API key.
      security: []
      operationId: vermarcoLiveness
      responses:
        '200':
          description: Endpoint status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
                  status:
                    type: string
                  callback_url:
                    type: string
                  served_vertical:
                    type: string
    post:
      tags: [webhooks]
      summary: Vermarco delivery callback
      description: |
        The marketplace's signed delivery endpoint. Every POST is
        Ed25519-signed by the platform (headers X-VM-Key-Id,
        X-VM-Signature, X-VM-Signature-Alg, X-VM-Timestamp,
        X-VM-Body-Sha256); unsigned or badly signed requests are
        rejected with 401.

        Message types (JSON body, field `type`):
        - `verification_challenge` — answered with `{"nonce": "<same
          nonce>"}` within the platform's 15 s budget.
        - `delivery_request` — answered with `{"data": {...}}`: a
          per-query slice of filings matching the request's `query`,
          capped under the platform's 10 MB response limit, with a
          `__sha256` JCS (RFC 8785) integrity attestation inside
          `data`. No matching data answers 404 / `{"available":
          false}` and the buyer is not charged.
        - Any other signed POST is treated as a platform probe and
          answered `{"ok": true}`.
      security: []
      operationId: vermarcoCallback
      parameters:
        - name: X-VM-Key-Id
          in: header
          required: true
          description: Platform signing key id (see GET https://vermarco.com/api/signing-key).
          schema:
            type: string
        - name: X-VM-Signature
          in: header
          required: true
          description: Base64url detached Ed25519 signature over "POST\n<callbackUrl>\n<timestamp>\n<body-sha256-hex>".
          schema:
            type: string
        - name: X-VM-Signature-Alg
          in: header
          required: true
          schema:
            type: string
            enum: [ed25519]
        - name: X-VM-Timestamp
          in: header
          required: true
          schema:
            type: string
        - name: X-VM-Body-Sha256
          in: header
          required: true
          description: Lowercase hex SHA-256 of the raw request body.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [verification_challenge, delivery_request]
                nonce:
                  type: string
                listingId:
                  type: string
                fingerprint:
                  type: string
                title:
                  type: string
                verticalSlug:
                  type: string
                query:
                  type: object
                  description: Delivery filters — the same names as the /v1/businesses search parameters (state, city, parish, county, region, q, category, need, type, origin, year, from, to, age_days, limit).
                issuedAt:
                  type: string
      responses:
        '200':
          description: 'Challenge answer ({"nonce": ...}), delivery ({"data": {...}}), availability decline ({"available": false}), or probe acknowledgement ({"ok": true}).'
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /.well-known/agent.json:
    get:
      tags: [system]
      summary: Agent discovery document
      description: |
        Public. The machine-readable front door for AI agents: what
        Second Desk sells, the API base, the OpenAPI and MCP
        endpoints, the catalog endpoint, the key plans with prices,
        and the contact email. The whole buying path — this document,
        the catalog, key auth, data delivery, the work board — is
        plain HTTPS plus the X-API-Key header: no browser, no
        cookies, no JavaScript challenges.
      security: []
      operationId: agentCard
      responses:
        '200':
          description: Agent discovery document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCard'
  /v1/keys:
    post:
      tags: [keys]
      summary: Get a free-tier API key instantly (self-serve)
      description: |
        Send an email address; a free-tier key comes back in the same
        response. No browser, no human wait. The key is SHOWN ONCE and
        stored hashed, so it cannot be recovered later — store it when
        you receive it. One active free key per email. Rate limited to
        5 attempts per email per hour and 10 attempts per IP per hour.
        Free tier: 50 requests/day across all endpoints, full catalog
        access. Every error body below includes a `next_step` field
        telling the caller exactly what to do.
      operationId: issueFreeKey
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRequest'
      responses:
        '201':
          description: Key issued. `api_key` appears only in this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyIssued'
        '400':
          description: |
            Bad request. `error` is one of: `invalid_email` (address
            missing, not a string, or malformed — next step: send a
            valid email), `missing_field` (no email field — next step:
            send {"email": "..."}), `unexpected_field` (extra fields —
            next step: send only the email field), `bad_json` /
            `bad_body` (body is not a JSON object — next step: send a
            JSON object).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            `key_already_issued` — this email already has an active
            free key. It was shown once at issuance and is stored
            hashed, so it cannot be shown again. Next step: use the
            original key; if it is lost, email seconddesks@proton.me
            from that address to revoke it, then re-issue here.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: |
            `body_too_large` — request body over 64 KB. Next step: send
            only the small JSON body this endpoint needs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: |
            `rate_limited` — more than 5 attempts for this email or 10
            attempts from this IP in the last hour. The body carries
            `retry_after_seconds` and the `Retry-After` header is set.
            Next step: wait that long, then retry once.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds to wait before retrying.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: |
            `key_issuance_unavailable` — issuance is not configured on
            this deployment. Next step: email seconddesks@proton.me
            for a key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /changelog:
    get:
      tags: [discovery]
      summary: Public release history
      description: Dated changelog entries for every release (v1 launch, v2, the agent commerce release, and onward). Public, no key required.
      operationId: getChangelog
      security: []
      responses:
        '200':
          description: The changelog document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Changelog'
  /v1/catalog:
    get:
      tags: [catalog]
      summary: Every sellable data family
      description: |
        One JSON document listing every sellable family with its
        description, pack count, record count, storefront URL and
        the endpoint for its packs. Any valid API key may read the
        catalog (the free key included); the catalog carries names,
        counts and prices only — no records — so it is not
        scope-restricted.
      operationId: catalogIndex
      responses:
        '200':
          description: The full catalog index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogIndex'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/catalog/{family}:
    get:
      tags: [catalog]
      summary: One family's packs, with prices
      description: |
        Every sellable pack in one family — title, record count,
        monthly and one-time USD prices (null when the register
        lists no price), the free-test-pack flag, and the channel
        URL where the pack file is sold. Ordered by record count,
        biggest first; paginate with limit/offset.
      operationId: catalogFamily
      parameters:
        - name: family
          in: path
          required: true
          description: Family slug from GET /v1/catalog (e.g. filings, ucc-filings, warn-act).
          schema:
            type: string
        - name: limit
          in: query
          description: Page size, 1–100 (default 25).
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          description: Paging offset (default 0).
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: The family's packs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogFamilyPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/jobs:
    get:
      tags: [board]
      summary: List open roles on the work board
      description: |
        Roles posted by employers through this API, newest first.
        Filter with q (substring over title, company, location and
        description) and location (substring). Entries show exactly
        the fields the poster submitted.
      operationId: listJobs
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Open roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    post:
      tags: [board]
      summary: Post a role to the work board
      description: |
        Plain data only — no file uploads. All fields are required
        strings with length caps (title/company/location 120,
        description 4000, contact 200); unknown fields, wrong types
        and empty required fields are rejected with 400. The contact
        is shown publicly on the board: post only a contact you want
        candidates to use.
      operationId: postJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobPost'
      responses:
        '201':
          description: The created role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/jobs/{id}:
    delete:
      tags: [board]
      summary: Remove a role you posted
      description: |
        Only the API key that posted an entry can delete it. An
        unknown id and another poster's id answer the same 404, so
        the board leaks nothing about other posters' entries.
      operationId: deleteJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/resumes:
    get:
      tags: [board]
      summary: Search resumes listed by the candidates themselves
      description: |
        Every resume here was listed by the candidate, with their
        explicit consent, for employers to find them — nothing is
        scraped, and the contact shown is the contact each candidate
        chose to share. Filter with role and location (case-insensitive
        substring matches).
      operationId: listResumes
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Matching resume listings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeList'
        '401':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
    post:
      tags: [board]
      summary: List your own resume summary
      description: |
        A candidate lists their OWN resume summary. The body must
        carry "consent": true (the boolean) confirming the candidate
        agrees to be listed for employers to find them; anything else
        is rejected with 400 consent_required. Plain data only — no
        file uploads. The contact field is shown publicly: share
        only a contact you want employers to use.
      operationId: postResume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumePost'
      responses:
        '201':
          description: The created resume listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resume'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
  /v1/resumes/{id}:
    delete:
      tags: [board]
      summary: Remove your own resume listing
      description: |
        Only the API key that listed an entry can delete it. An
        unknown id and another poster's id answer the same 404.
      operationId: deleteResume
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key issued for this API. Tiers: Free (50 requests/day,
        all-data scope), City Heavy $29/mo (5,000/day, one city bound
        to the key), Full State Heavy $59/mo (10,000/day, one state
        bound to the key).
  headers:
    XRateLimitLimit:
      description: The key's daily request limit.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Requests remaining today (UTC) for this key.
      schema:
        type: integer
    XPlanTier:
      description: The key's plan tier.
      schema:
        type: string
  responses:
    Error:
      description: JSON error body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code (e.g. invalid_or_missing_api_key, daily_quota_exceeded, not_found, bad_category, signature_verification_failed).
        detail:
          type: string
        tier:
          type: string
        daily_limit:
          type: integer
        valid_categories:
          type: array
          items:
            type: string
        valid_needs:
          type: array
          items:
            type: string
      required: [error]
    Scope:
      type: object
      description: The API key's bound scope.
      properties:
        type:
          type: string
          enum: [all, state, city]
        state:
          type: string
        city:
          type: string
      required: [type]
    Health:
      type: object
      properties:
        status:
          type: string
          example: ok
        dataset:
          type: string
        records:
          type: integer
          example: 5724302
        states:
          type: array
          items:
            type: string
        records_by_state:
          type: object
          additionalProperties:
            type: integer
        data_generated_at:
          type: string
        filing_date_range:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
        classifier:
          type: string
        server_time:
          type: string
          format: date-time
    FilingRecord:
      type: object
      description: One business filing, reproduced from the public filing as published, with derived fields documented in the API README.
      properties:
        id:
          type: string
          description: Same value as charter_number.
        charter_number:
          type: string
          description: The state's charter number — the stable ID.
        name:
          type: string
        name_raw:
          type: string
          description: Name exactly as filed.
        entity_type:
          type: string
          description: Heuristic from the charter suffix (see data/SOURCES.md in the repo).
        origin:
          type: string
          enum: [domestic, foreign]
        filing_date:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
          description: Mailing address as filed.
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
          description: Mailing-address state as filed — for foreign entities this is often out-of-state. Use filing_state for the state whose filings the record belongs to.
        zip:
          type: string
          nullable: true
        filing_state:
          type: string
          description: The state whose filings this record belongs to — what state= filtering, scope, and /v1/regions use.
        parish:
          type: string
          nullable: true
          description: Louisiana only; derived from city, null when it cannot be assigned honestly.
        county:
          type: string
          nullable: true
          description: Non-LA states, when the source provides it.
        region:
          type: string
          nullable: true
          description: The record's parish or county, whichever its state uses.
        category:
          type: string
          description: Industry slug, inferred from the business name.
        category_label:
          type: string
        needs:
          type: array
          items:
            type: string
          description: Likely-need segment slugs the record belongs to.
        registered_agent:
          type: string
          nullable: true
        agents:
          type: array
          items:
            type: string
        agent_is_commercial:
          type: boolean
          description: True when the registered agent's name matches a known commercial formation/registered-agent mill — name-matched only; the record itself is never altered or dropped.
        email_as_filed:
          type: string
          nullable: true
          description: Connecticut only — the business email the filer itself published in the state registry; a public record, not marketing consent.
        naics_code:
          type: string
          nullable: true
          description: Connecticut only — the NAICS code the filer reported to the registry.
        naics_title:
          type: string
          nullable: true
          description: Connecticut only — the NAICS title the filer reported to the registry.
        source_file:
          type: string
          nullable: true
        source_url:
          type: string
          nullable: true
    SearchResponse:
      type: object
      properties:
        count:
          type: integer
          description: Total records matching the filters (all pages).
        limit:
          type: integer
        offset:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/FilingRecord'
        scope:
          $ref: '#/components/schemas/Scope'
        scope_note:
          type: string
          description: Present when the request explicitly asked outside the key's scope.
        age_reference_date:
          type: string
          format: date
          description: Present on age_days queries — the dataset date the age window is anchored to.
      required: [count, limit, offset, results, scope]
    RegionsResponse:
      type: object
      properties:
        states:
          type: object
          additionalProperties:
            type: object
            properties:
              region_type:
                type: string
                enum: [parish, county]
              regions_covered:
                type: integer
              records_with_region:
                type: integer
              records_total:
                type: integer
              regions:
                type: array
                items:
                  type: object
                  properties:
                    region:
                      type: string
                    filings:
                      type: integer
        records_total:
          type: integer
        scope:
          $ref: '#/components/schemas/Scope'
        scope_note:
          type: string
    CategoriesResponse:
      type: object
      properties:
        state:
          type: string
          description: The requested state, or "all".
        total_records:
          type: integer
        industries:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              label:
                type: string
              records:
                type: integer
        needs:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              label:
                type: string
              description:
                type: string
              records:
                type: integer
        scope:
          $ref: '#/components/schemas/Scope'
        note:
          type: string
        scope_note:
          type: string
    AgentCard:
      type: object
      description: The /.well-known/agent.json discovery document.
      properties:
        name:
          type: string
        legal_name:
          type: string
        description:
          type: string
        site:
          type: string
        api_base:
          type: string
        openapi:
          type: string
        mcp_endpoint:
          type: string
        catalog_endpoint:
          type: string
        contact_email:
          type: string
        auth:
          type: object
          properties:
            type:
              type: string
            header:
              type: string
            how_to_get_a_key:
              type: string
            free_key_endpoint:
              type: string
        plans:
          type: array
          items:
            type: object
        changelog:
          type: string
        pricing_policy:
          type: string
        endpoints:
          type: object
    KeyRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: The key is bound to this email (one active free key per email).
    KeyIssued:
      type: object
      properties:
        api_key:
          type: string
          description: The new key. Shown once, in this response only; stored hashed.
        tier:
          type: string
          example: free
        daily_limit:
          type: integer
          example: 50
        scope:
          type: object
        shown_once:
          type: boolean
        next_step:
          type: string
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Machine-readable error code.
        detail:
          type: string
          description: What went wrong, in plain language.
        next_step:
          type: string
          description: Exactly what the caller should do next.
        field:
          type: string
          description: The offending field, when one applies.
        retry_after_seconds:
          type: integer
          description: On 429, seconds to wait before retrying.
    Changelog:
      type: object
      properties:
        service:
          type: string
        changelog:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              date:
                type: string
                format: date
              title:
                type: string
              changes:
                type: array
                items:
                  type: string
        note:
          type: string
    CatalogFamilySummary:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        packs:
          type: integer
        records:
          type: integer
        site_url:
          type: string
        packs_endpoint:
          type: string
    CatalogIndex:
      type: object
      properties:
        business:
          type: string
        site:
          type: string
        api_base:
          type: string
        generated_at:
          type: string
        totals:
          type: object
          properties:
            families:
              type: integer
            packs:
              type: integer
            records:
              type: integer
        families:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFamilySummary'
        how_to_buy:
          type: string
    CatalogPack:
      type: object
      properties:
        id:
          type: string
          description: Stable pack id (sd-…); stable across catalog rebuilds while the pack title is unchanged.
        title:
          type: string
        records:
          type: integer
        price_monthly_usd:
          type: number
          nullable: true
        price_onetime_usd:
          type: number
          nullable: true
        free:
          type: boolean
        state:
          type: string
          nullable: true
        kind:
          type: string
          nullable: true
        window:
          type: string
          nullable: true
        buy_url:
          type: string
          nullable: true
    CatalogFamilyPage:
      type: object
      properties:
        family:
          type: object
          description: The family's full detail (slug, name, description, blurb, packs, records, site_url, fields, honesty, status).
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        packs:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPack'
    JobPost:
      type: object
      description: All fields required; plain strings only, no file uploads.
      properties:
        title:
          type: string
          maxLength: 120
        company:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 4000
        contact:
          type: string
          maxLength: 200
          description: Shown publicly on the board; use a contact you want candidates to use.
      required: [title, company, location, description, contact]
    Job:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        description:
          type: string
        contact:
          type: string
      required: [id, created_at, title, company, location, description, contact]
    JobList:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
    ResumePost:
      type: object
      description: A candidate lists their own resume summary. consent must be the boolean true.
      properties:
        name:
          type: string
          maxLength: 120
        role:
          type: string
          maxLength: 120
        location:
          type: string
          maxLength: 120
        experience:
          type: string
          maxLength: 4000
        contact:
          type: string
          maxLength: 200
          description: Shown publicly on the board; share only a contact you want employers to use.
        consent:
          type: boolean
          description: Must be true — the candidate confirms they agree to be listed for employers to find them. Missing, false, or a non-boolean value is rejected with 400 consent_required.
      required: [name, role, location, experience, contact, consent]
    Resume:
      type: object
      properties:
        id:
          type: string
        created_at:
          type: string
        name:
          type: string
        role:
          type: string
        location:
          type: string
        experience:
          type: string
        contact:
          type: string
      required: [id, created_at, name, role, location, experience, contact]
    ResumeList:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        note:
          type: string
        resumes:
          type: array
          items:
            $ref: '#/components/schemas/Resume'
